services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: r2_manager
      POSTGRES_USER: r2_manager
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - r2_manager_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r2_manager -d r2_manager"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  r2_manager_postgres:
